{% extends 'base.html' %}{% block content %}<section class="form-shell"><h1>Отзыв о конференции</h1><form class="panel form-card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% if error %}<p class="field-error">{{error}}</p>{% endif %}<label>Оценка<select name="rating">{% for n in range(1,6) %}<option value="{{n}}">{{n}}</option>{% endfor %}</select></label><label>Отзыв<textarea name="body" rows="5" maxlength="1000"></textarea></label><button class="button">Отправить отзыв</button></form></section>{% endblock %}
