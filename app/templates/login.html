{% extends 'base.html' %}{% block content %}<section class="form-shell"><h1>Вход</h1><p class="muted">Войдите в личный кабинет</p><form method="post" class="panel form-card" novalidate data-validate><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% if error %}<p class="field-error">{{error}}</p>{% endif %}<label>Логин<input name="login" maxlength="20" autocomplete="username"><small class="field-error"></small></label><label>Пароль<input name="password" type="password" maxlength="128" autocomplete="current-password"><small class="field-error"></small></label><button class="button" type="submit">Войти</button></form><p>Нет аккаунта? <a href="{{url_for('auth.register')}}">Регистрация</a></p></section>{% endblock %}
