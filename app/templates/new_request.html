{% extends 'base.html' %}{% block content %}<section class="form-shell"><h1>Новая заявка</h1><p>Подайте заявку на участие в конференции.</p><form class="panel form-card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% if error %}<p class="field-error">{{error}}</p>{% endif %}<label>Мероприятие<select name="event_id" required><option value="">Выберите</option>{% for e in events %}<option value="{{e['id']}}">{{e['title']}} ({{e['event_date']}})</option>{% endfor %}</select></label><label>Помещение<select name="room">{% for room in rooms %}<option>{{room}}</option>{% endfor %}</select></label><label>Способ оплаты<select name="payment">{% for p in payments %}<option>{{p}}</option>{% endfor %}</select></label><label>Количество мест<input name="seats" type="number" min="1" max="50" value="1"></label><button class="button">Отправить заявку</button></form></section>{% endblock %}
