{% extends 'base.html' %}{% block content %}<section class="form-shell"><h1>Изменить заявку № {{item['id']}}</h1><form class="panel form-card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% if error %}<p class="field-error">{{error}}</p>{% endif %}<label>Помещение<select name="room">{% for v in rooms %}<option {% if v==item['room'] %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>Оплата<select name="payment">{% for v in payments %}<option {% if v==item['payment'] %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>Мест<input name="seats" type="number" min="1" max="50" value="{{item['seats']}}"></label><button class="button">Сохранить изменения</button></form></section>{% endblock %}
